[package]
name = "worldvm-simulator"
version = "1.0.0"
edition = "2021"
authors = ["WorldVM Contributors"]
description = "Deterministic local simulated game host for WorldVM mod testing and development"
license = "Apache-2.0"

[dependencies]
worldvm-core = { path = "../worldvm-core" }
worldvm-abi = { path = "../worldvm-abi" }
worldvm-capabilities = { path = "../worldvm-capabilities" }
worldvm-runtime = { path = "../worldvm-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
tracing = "0.1"
