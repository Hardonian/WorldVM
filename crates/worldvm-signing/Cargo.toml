[package]
name = "worldvm-signing"
version = "1.0.0"
edition = "2021"
authors = ["WorldVM Contributors"]
description = "Ed25519 package signing, canonical content hashing, and trust verification for WorldVM"
license = "Apache-2.0"

[dependencies]
worldvm-core = { path = "../worldvm-core" }
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "std", "rand_core"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
