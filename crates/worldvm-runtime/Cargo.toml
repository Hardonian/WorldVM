[package]
name = "worldvm-runtime"
version = "1.0.0"
edition = "2021"
authors = ["WorldVM Contributors"]
description = "WebAssembly sandbox engine, fuel metering, epoch deadlines, and capability enforcement for WorldVM"
license = "Apache-2.0"

[dependencies]
worldvm-core = { path = "../worldvm-core" }
worldvm-abi = { path = "../worldvm-abi" }
worldvm-capabilities = { path = "../worldvm-capabilities" }
worldvm-package = { path = "../worldvm-package" }
worldvm-signing = { path = "../worldvm-signing" }
worldvm-sentinel = { path = "../worldvm-sentinel" }
worldvm-metering = { path = "../worldvm-metering" }
wasmtime = { version = "48.0", default-features = false, features = ["cranelift", "runtime", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
parking_lot = "0.12"

[dev-dependencies]
wat = "1.258"
worldvm-simulator = { path = "../worldvm-simulator" }

[[bench]]
name = "runtime_bench"
harness = false
