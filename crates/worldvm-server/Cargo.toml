[package]
name = "worldvm-server"
version = "1.0.0"
edition = "2021"
authors = ["WorldVM Contributors"]
description = "Headless server-authoritative execution runtime and receipt generator for WorldVM"
license = "Apache-2.0"

[dependencies]
worldvm-core = { path = "../worldvm-core" }
worldvm-abi = { path = "../worldvm-abi" }
worldvm-capabilities = { path = "../worldvm-capabilities" }
worldvm-package = { path = "../worldvm-package" }
worldvm-signing = { path = "../worldvm-signing" }
worldvm-runtime = { path = "../worldvm-runtime" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
thiserror = "2.0"
