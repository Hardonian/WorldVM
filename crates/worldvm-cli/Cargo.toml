[package]
name = "worldvm-cli"
version = "1.0.0"
edition = "2021"
authors = ["WorldVM Contributors"]
description = "WorldVM developer toolchain CLI: init, dev, build, test, inspect, package, verify, sign, doctor"
license = "Apache-2.0"

[[bin]]
name = "worldvm"
path = "src/main.rs"

[dependencies]
worldvm-core = { path = "../worldvm-core" }
worldvm-abi = { path = "../worldvm-abi" }
worldvm-capabilities = { path = "../worldvm-capabilities" }
worldvm-signing = { path = "../worldvm-signing" }
worldvm-package = { path = "../worldvm-package" }
worldvm-runtime = { path = "../worldvm-runtime" }
worldvm-simulator = { path = "../worldvm-simulator" }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
hex = "0.4"
