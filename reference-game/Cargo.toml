[package]
name = "reference-game"
version = "1.0.0"
edition = "2021"
authors = ["WorldVM Contributors"]
description = "Neon Arena — Reference game playground demonstrating live sandboxed mod execution"
license = "Apache-2.0"

[[bin]]
name = "neon-arena"
path = "src/main.rs"

[dependencies]
worldvm-core = { path = "../crates/worldvm-core" }
worldvm-abi = { path = "../crates/worldvm-abi" }
worldvm-capabilities = { path = "../crates/worldvm-capabilities" }
worldvm-package = { path = "../crates/worldvm-package" }
worldvm-runtime = { path = "../crates/worldvm-runtime" }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
