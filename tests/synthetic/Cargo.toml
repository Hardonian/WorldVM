[package]
name = "tests-synthetic"
version = "1.0.0"
edition = "2021"
authors = ["WorldVM Contributors"]
description = "WorldVM Synthetic Test Lab: full-stack game simulation, hostile module corpus, multiplayer chaos, and security validation"
license = "Apache-2.0"

[[bin]]
name = "synthetic-lab"
path = "src/main.rs"

[dependencies]
worldvm-core = { path = "../../crates/worldvm-core" }
worldvm-abi = { path = "../../crates/worldvm-abi" }
worldvm-capabilities = { path = "../../crates/worldvm-capabilities" }
worldvm-package = { path = "../../crates/worldvm-package" }
worldvm-signing = { path = "../../crates/worldvm-signing" }
worldvm-runtime = { path = "../../crates/worldvm-runtime" }
worldvm-simulator = { path = "../../crates/worldvm-simulator" }
worldvm-sentinel = { path = "../../crates/worldvm-sentinel" }
worldvm-metering = { path = "../../crates/worldvm-metering" }
wat = "1.258"
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4.5", features = ["derive"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
